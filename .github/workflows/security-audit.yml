name: Security Audit
run-name: "Detect security vulnerabilities - ${{ github.ref_name }} - #${{ github.run_number }}"
on:
  schedule:
    - cron: "0 10 20 * *"
  workflow_dispatch:
jobs:
  Security-audit:
    runs-on: ubuntu-24.04
    steps:
      - run: echo "🐧 This Job is running on branch${{ github.ref_name }} on ${{ github.repository}}."
      - name: Check out repository code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7
      - name: Setup node and npm
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Run security audit
        run: npm audit
