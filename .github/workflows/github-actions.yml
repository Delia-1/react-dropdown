name: GitHub Hello Project
run-name: ${{ github.actor }} is testing out GitHub Actions 🚀
on: [push]
jobs:
  Check-code-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
      - name: setup node and npm
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Run npm ci
        run: npm ci
      - name: Eslint Check
        run: |
          echo "code quality scan"
          npm run lint
      - run: echo "🍏 This job's status is ${{ job.status }}."
  Explore-GitHub-Actions:
    needs: Check-code-quality
    runs-on: ubuntu-latest
    steps:
      - run: echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."
      - run: echo "🐧 This job is now running on a ${{ runner.os }} server hosted by github."
      - run: echo "🔎 The name of your branch is ${{ github.ref }}, branch name is ${{ github.ref_name }} and your repository is ${{ github.repository}}."
      - name: Check out repository code
        uses: actions/checkout@v6
      - run: echo "💡 The ${{ github.repository }} repository has been cloned to the runner."
      - run: echo "🖥️ The workflow is now ready to test your code on the runner."
      - name: runner path
        run: pwd
      - name: List of files
        run: ls -la
      - name: Check node
        run: node -v
      - name: Check npm
        run: npm -v
      - name: setup node and npm
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Check node after seteup
        run: node -v
      - name: Check npm after setup
        run: npm -v
      - name: install dependencies -npm ci
        run: |
          echo "files before deps install:"
          ls -la
          npm ci 
          echo  "files after deps install, deps added? "
          ls -la
          echo  "deps: "
          npm ls --depth=0
      - name: Build Library
        run: |
          npm run build
          ls -lh dist/
      - name: Pack Library
        run: |
          npm pack 
          ls -la *.tgz
      - name: Share generated artifact
        uses: actions/upload-artifact@v7
        with:
          name: "light-react-dropdown-${{ github.sha }}"
          path: "*.tgz"
          if-no-files-found: "error"
          retention-days: "7"
      - run: echo "🍏 This job's status is ${{ job.status }}."
