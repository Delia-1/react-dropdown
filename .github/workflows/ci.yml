name: Generate demo library artifact
run-name: "Generate dropdown artifact - ${{ github.ref_name }} - #${{ github.run_number }}"
on: [push]
jobs:
  Build-and-package:
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - run: echo "🐧 This Job is running on branch${{ github.ref_name }} on ${{ github.repository}}."
      - name: Check out repository code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7
        with:
          fetch-depth: 0
      - name: Setup node and npm
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Eslint Check
        run: npm run lint
      - name: SonarQube scan
        if: ${{ github.ref == 'refs/heads/master' }}
        uses: SonarSource/sonarqube-scan-action@70bad232163b09d998ea0707ee80c0ec80798c16 # v8.5.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=delia-1
            -Dsonar.projectKey=Delia-1_react-dropdown
      - name: Build Library
        run: npm run build
      - name: Pack Library
        run: npm pack
      - name: Generate artifact attestations
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: "*.tgz"
      - name: Check for attestation integrity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh attestation verify *.tgz --repo "${{ github.repository }}"
      - name: Share generated artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "light-react-dropdown-${{ github.sha }}"
          path: "*.tgz"
          if-no-files-found: "error"
          retention-days: "7"
      - name: report job status
        if: always()
        run: echo "🍏 This job's status is ${{ job.status }}."
